name: Sync page from the live site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the deployed page and track
        run: |
          set -euo pipefail
          base=https://site-d0228ea15ede4df3bf8c4f0108aad660.freebuff.page
          curl -fsSL "$base/?cb=${{ github.run_id }}" -o index.html
          curl -fsSL "$base/tu-jaane-na.mp3" -o tu-jaane-na.mp3
          wc -c index.html tu-jaane-na.mp3

      - name: Commit when it changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tu-jaane-na.mp3
          git diff --cached --quiet && echo "already in sync" || git commit -m "Sync page and track from the live site"
          git push
